[package]
name = "rping"
version = "0.1.0"
edition = "2021"
authors = ["Leandro"]
description = "A high-performance, cross-platform ping utility in Rust with colored output"
readme = "README.md"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
tokio = { version = "1.40", default-features = false, features = ["rt", "macros", "time", "signal"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
thiserror = "2.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "ping_bench"
harness = false

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
